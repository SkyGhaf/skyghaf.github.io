    </header>

    <main>
      <section>
        <h2>Contact</h2>

        <form id="contact-form" novalidate>
          <div class="veld">
            <label for="naam">Naam</label>
            <input
              type="text"
              id="naam"
              name="naam"
              required
              minlength="2"
              autocomplete="name"
              aria-describedby="naam-error"
              aria-invalid="false"
            />
            <span id="naam-error" class="foutmelding" role="alert"></span>
          </div>

          <div class="veld">
            <label for="email">E-mail</label>
            <input
              type="email"
              id="email"
              name="email"
              required
              autocomplete="email"
              aria-describedby="email-error"
              aria-invalid="false"
            />
            <span id="email-error" class="foutmelding" role="alert"></span>
          </div>

          <div class="veld">
            <label for="bericht">Bericht</label>
            <textarea
              id="bericht"
              name="bericht"
              rows="5"
              required
              minlength="10"
              aria-describedby="bericht-error"
              aria-invalid="false"
            ></textarea>
            <span id="bericht-error" class="foutmelding" role="alert"></span>
          </div>

          <button type="submit">Versturen</button>
          <div id="form-status" aria-live="polite"></div>
        </form>
      </section>
    </main>
